version: "3.9"
services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mongodb://localhost:27017/bitaksi
    volumes:
      - mongo_data:/data/db

  driver-service:
    build: ./driver-service
    container_name: driver-service
    restart: always
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      PORT: "8081"
      MONGO_DB_NAME: "bitaksi"
    ports:
      - "8081:8081"
    depends_on:
      - mongo

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      DRIVER_SERVICE_URL: "http://localhost:8081" 
      JWT_SECRET: "your-jwt-secret"
      PORT: "8080"
    depends_on:
      - driver-service

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo_data:
